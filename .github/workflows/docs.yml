name: Docs

# Publishes docs/ (English and French documentation) to GitHub Pages.
# Independent from ci.yml: a docs-only change never runs the full test
# matrix, and this workflow never gates a merge.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch: {}

# One deployment at a time; a push never cancels a deployment already in
# flight (a reader could land on a half-replaced site).
concurrency:
  group: pages
  cancel-in-progress: false

# Least privilege by default; the jobs that need Pages access declare it
# themselves.
permissions:
  contents: read

# Actions pinned by commit SHA (the comment gives the version) — same
# convention as ci.yml: a moving tag would let a compromised upstream
# account push code into this workflow.
jobs:
  build:
    name: Build (Jekyll)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1.0.13
        with:
          source: ./docs
          destination: ./_site

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./_site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
