# Jekyll config for the GitHub Pages build of docs/ (see
# .github/workflows/docs.yml). Built-in theme only — no remote_theme, so the
# build needs no network access beyond the github-pages gem it already ships
# with (actions/jekyll-build-pages).
title: Striart
description: Multi-agent Git orchestrator for AI coding agents.
theme: jekyll-theme-cayman
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

# Rewrites links between .md files to their published .html paths, lets a
# directory's README.md serve as its index, infers a title from the first
# heading when a page has none, and allows .md files with no front matter
# (every page here) to still go through layout/rendering.
plugins:
  - jekyll-relative-links
  - jekyll-readme-index
  - jekyll-titles-from-headings
  - jekyll-optional-front-matter
  - jekyll-default-layout

relative_links:
  enabled: true
  collections: false

readme_index:
  with_frontmatter: false

# docs/_config.yml, docs/index.md and docs/.gitignore-adjacent build files
# aren't content; everything else under docs/ is included by default.
exclude:
  - _config.yml
