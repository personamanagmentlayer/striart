[package]
name = "striart-native"
version = "0.1.0"
description = "Composants natifs de Striart : identité et arbre de process, conteneur de process (Test Gate), hôte de pseudo-terminal"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "striart-native"
path = "src/main.rs"

[lib]
name = "striart_native"
path = "src/lib.rs"

[lints]
workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2.190"

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.61.2"
features = [
  "Wdk_System_Threading",
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_IO",
  "Win32_System_JobObjects",
  "Win32_System_Pipes",
  "Win32_System_Threading",
]
